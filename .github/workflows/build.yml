name: Probar y crear instalador

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compilar ayudantes de NVIDIA (NVAPI) y AMD (ADLX)
        run: |
          git clone --depth 1 https://github.com/NVIDIA/nvapi native/sdk/nvapi
          git clone --depth 1 https://github.com/GPUOpen-LibrariesAndSDKs/ADLX native/sdk/ADLX
          New-Item -ItemType Directory -Force native/bin, native/obj | Out-Null
          cl /nologo /EHsc /O2 /MT /utf-8 /I native/sdk/nvapi native/nvidia/toolbox-nv.cpp native/sdk/nvapi/amd64/nvapi64.lib /Fo:native/obj/ /Fe:native/bin/toolbox-nv.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cl /nologo /EHsc /O2 /MT /utf-8 /std:c++17 /I native/sdk/ADLX native/amd/toolbox-amd.cpp native/sdk/ADLX/SDK/ADLXHelper/Windows/Cpp/ADLXHelper.cpp native/sdk/ADLX/SDK/Platform/Windows/WinAPIs.cpp /Fo:native/obj/ /Fe:native/bin/toolbox-amd.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item native/sdk/nvapi/License.txt native/bin/NVAPI-LICENSE.txt
          Get-ChildItem native/bin

      - name: Probar en Windows real
        run: npm run test:windows

      - name: Probar «Gráficos» en Windows real
        run: node test/windows-graphics.js

      - name: Crear instalador
        # Reintenta una vez si falla la descarga de Electron/NSIS (fallo de red puntual)
        run: npm run dist; if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 20; npm run dist }

      - name: Comprobar protecciones de Electron y que la app arranca
        run: |
          npx --no-install @electron/fuses read --app dist/win-unpacked/ToolBox.exe | Tee-Object -FilePath fuses.txt
          foreach ($f in 'RunAsNode is Disabled', 'EnableNodeOptionsEnvironmentVariable is Disabled', 'EnableNodeCliInspectArguments is Disabled', 'EnableEmbeddedAsarIntegrityValidation is Enabled', 'OnlyLoadAppFromAsar is Enabled') {
            if (-not (Select-String -Path fuses.txt -SimpleMatch $f -Quiet)) { throw "Falta la protección: $f" }
          }
          # Arranca el programa empaquetado: si la verificación del asar fallara, no llegaría a escribir el registro
          $logDir = Join-Path $env:APPDATA 'ToolBox\logs'
          Remove-Item $logDir -Recurse -Force -ErrorAction SilentlyContinue
          $p = Start-Process dist/win-unpacked/ToolBox.exe -PassThru
          # Espera hasta 90 s (la primera vez el antivirus analiza el ejecutable nuevo)
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            $log = Get-Content (Join-Path $logDir '*.log') -Raw -ErrorAction SilentlyContinue
            if ($log -match 'Interfaz cargada|No se pudo cargar|se cerró inesperadamente') { break }
          }
          Write-Host "Proceso vivo: $(-not $p.HasExited)"
          Write-Host $log
          Stop-Process -Name ToolBox -Force -ErrorAction SilentlyContinue
          if ($log -notmatch 'iniciado') { throw 'El programa empaquetado no arrancó' }
          if ($log -notmatch 'Interfaz cargada') { throw 'La interfaz no se cargó' }

      - name: Subir instaladores
        uses: actions/upload-artifact@v4
        with:
          name: ToolBox-Windows
          path: dist/*.exe
          if-no-files-found: error

  reparaciones:
    # Prueba real de las reparaciones (la de «Revisar y reparar Windows» tarda ~20 min)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probar «Quitar apps» en Windows real
        run: node test/windows-bloat.js
      - name: Probar desinstalador completo y perfiles en Windows real
        run: node test/windows-uninstall.js
      - name: Probar reparaciones en Windows real
        run: node test/windows-repairs.js

  publicar:
    # Solo al subir una etiqueta de versión (p. ej. v0.7.0) y solo si TODAS las pruebas en Windows han pasado
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, reparaciones]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que la etiqueta coincide con la versión de la app
        run: |
          V="${GITHUB_REF_NAME#v}"
          P=$(node -p "require('./package.json').version")
          if [ "$V" != "$P" ]; then echo "La etiqueta $GITHUB_REF_NAME no coincide con package.json ($P)"; exit 1; fi

      - uses: actions/download-artifact@v4
        with:
          name: ToolBox-Windows
          path: dist

      - name: Notas de la versión y sumas de verificación
        run: |
          node scripts/release-notes.js "$GITHUB_REF_NAME" > notas.md
          cd dist && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: ToolBox ${{ github.ref_name }}
          body_path: notas.md
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
