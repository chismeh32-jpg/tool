name: Probar y crear instalador

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Probar en Windows real
        run: npm run test:windows

      - name: Crear instalador
        run: npm run dist

      - name: Subir instaladores
        uses: actions/upload-artifact@v4
        with:
          name: ToolBox-Windows
          path: dist/*.exe
          if-no-files-found: error
